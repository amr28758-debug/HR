name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: burtplace_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/burtplace_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/burtplace_test
      REDIS_URL: redis://localhost:6379
      AUTH_MODE: local
      AUTH_LOCAL_JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      API_KEY_PEPPER: ci-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/**' build
      - run: pnpm typecheck
      - run: pnpm test
